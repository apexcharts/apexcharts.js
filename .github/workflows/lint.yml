name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Use Node.js 22.x
        uses: actions/setup-node@v5
        with:
          node-version: 22.x
          cache: 'yarn'
      - run: yarn install --frozen-lockfile
      - name: Lint
        run: yarn lint
      # Compiles tests/types against types/apexcharts.d.ts, so a d.ts edit
      # that drops a consumer spelling (e.g. the named imports of #5077)
      # fails here instead of in a user's build.
      - name: Type-check the public d.ts
        run: yarn typecheck:types
