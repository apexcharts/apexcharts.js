name: Publish to npm

on:
  push:
    branches:
      - main

permissions:
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check commit message for release trigger
        id: check
        env:
          # Passed as an environment variable, never interpolated into the
          # script. `${{ }}` is substituted textually before bash parses, so a
          # commit message containing a double quote breaks the script, and one
          # containing $(...) or backticks would RUN in this job, which holds the
          # npm publishing token. Merge commit messages include the PR title,
          # which any outside contributor controls. This is not theoretical: run
          # 30286173185 died with `syntax error near unexpected token '('` on the
          # merge of PR #5245, whose title contained quotes and parentheses.
          MSG: ${{ github.event.head_commit.message }}
        run: |
          if echo "$MSG" | grep -qE '^release: [0-9]+\.[0-9]+\.[0-9]+'; then
            VERSION=$(echo "$MSG" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+[^ ]*' | head -1)
            echo "triggered=true" >> $GITHUB_OUTPUT
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            # A prerelease takes a tag naming its own RELEASE LINE:
            # 7.4.0-rc.1 publishes under `rc-7.4`.
            #
            # Deliberately not a floating `next`. A tag naming a position has to
            # be maintained: the moment a stable ships, `next` points at
            # something older than `latest` and `npm i apexcharts@next` quietly
            # installs the wrong thing. Moving it back is a registry write, and
            # npm's OIDC trusted publishing covers `npm publish` only, so a
            # workflow that fixed it would need a publish-capable token in a
            # repo that deliberately holds none. A tag naming a line never goes
            # stale, because it states a fact rather than a position.
            #
            # `npm i apexcharts@next` therefore fails with "No matching
            # version", which is the honest answer and better than an old one.
            # Release notes name the exact tag for anyone wanting the rc.
            if echo "$VERSION" | grep -qE '[-]'; then
              LINE=$(echo "$VERSION" | sed -E 's/^([0-9]+\.[0-9]+).*/\1/')
              echo "tag=rc-$LINE" >> $GITHUB_OUTPUT
              echo "ℹ️  prerelease $VERSION publishes under 'rc-$LINE'"
            else
              echo "tag=latest" >> $GITHUB_OUTPUT
            fi
          else
            echo "triggered=false" >> $GITHUB_OUTPUT
          fi

      - name: Verify package.json version matches commit message
        if: steps.check.outputs.triggered == 'true'
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          MSG_VERSION="${{ steps.check.outputs.version }}"
          if [ "$PKG_VERSION" != "$MSG_VERSION" ]; then
            echo "❌ package.json version ($PKG_VERSION) does not match commit message version ($MSG_VERSION)"
            exit 1
          fi
          echo "✅ Version $PKG_VERSION confirmed"

      - uses: actions/setup-node@v5
        if: steps.check.outputs.triggered == 'true'
        with:
          node-version: "22"

      - run: npm install -g npm@latest
        if: steps.check.outputs.triggered == 'true'

      - run: yarn install --frozen-lockfile
        if: steps.check.outputs.triggered == 'true'

      - run: yarn unit
        if: steps.check.outputs.triggered == 'true'

      - run: yarn build
        if: steps.check.outputs.triggered == 'true'

      # After the build, because it drives the built bundle: a forged key that is
      # not watermarked means signatures are verified and ignored, and `yarn unit`
      # passes either way. 6.6.0 shipped exactly that.
      - run: yarn check:license-enforcement
        if: steps.check.outputs.triggered == 'true'

      - run: npm publish --provenance --tag ${{ steps.check.outputs.tag }}
        if: steps.check.outputs.triggered == 'true'
