<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Basic Raincloud Chart</title>

    <link href="../../assets/styles.css" rel="stylesheet" />

    <style>
      #chart {
        max-width: 820px;
        margin: 35px auto;
      }
    </style>

    
    <script src="https://cdn.jsdelivr.net/npm/react@17.0.2/umd/react.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@17.0.2/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prop-types@15.8.1/prop-types.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/babel-core@5.8.34/browser.min.js"></script>
    <script src="../../../dist/apexcharts.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-apexcharts@1.7.0/dist/react-apexcharts.iife.min.js"></script>
    

    <script>
      // Replace Math.random() with a pseudo-random number generator to get reproducible results in e2e tests
      // Based on https://gist.github.com/blixt/f17b47c62508be59987b
      var _seed = 42
      Math.random = function () {
        _seed = (_seed * 16807) % 2147483647
        return (_seed - 1) / 2147483646
      }
    </script>

    <script src="../../../dist/features/raincloud.js"></script>
  <script>
    // Raw observations for one group: a Gaussian sample via the Box-Muller
    // transform. The sample template seeds Math.random, so this renders
    // identically across reloads. Raincloud takes the SAMPLE, and the library
    // derives the density (cloud) and the five-number summary (box) from it.
    function sample(mean, sd, n) {
      var points = []
      for (var k = 0; k < n; k++) {
        var u1 = Math.random(),
          u2 = Math.random()
        var g = Math.sqrt(-2 * Math.log(u1)) * Math.cos(2 * Math.PI * u2)
        points.push(Math.round((mean + g * sd) * 10) / 10)
      }
      return points
    }
  </script>
  </head>

  <body>
    
    <div id="app"></div>

    <div id="html">&lt;div id=&quot;chart&quot;&gt;
  &lt;ReactApexChart options={state.options} series={state.series} type=&quot;raincloud&quot; height={460} /&gt;
&lt;/div&gt;</div>

    <script type="text/babel">
      const ApexChart = () => {
        const [state, setState] = React.useState({
          series: [
            {
              name: 'Weight gain',
              data: [
                { x: 'DD', points: sample(97, 26, 220) },
                { x: 'DR', points: sample(84, 20, 160) },
                { x: 'RD', points: sample(101, 27, 200) },
                { x: 'RR', points: sample(80, 22, 210) },
              ],
            },
          ],
          options: {
            chart: {
              type: 'raincloud',
              height: 460,
            },
            title: {
              text: 'Weight gain from birth to weaning, by genotype',
            },
            subtitle: {
              text: 'Each dot is one animal; box = quartiles, curve = density',
            },
            plotOptions: {
              bar: {
                distributed: true, // one colour per group
              },
            },
            legend: {
              show: false, // distributed colours make the legend redundant
            },
            yaxis: {
              title: {
                text: 'Weight gain (g/day)',
              },
            },
          },
        })

        return (
          <div>
            <div id="chart">
              <ReactApexChart
                options={state.options}
                series={state.series}
                type="raincloud"
                height={460}
              />
            </div>
            <div id="html-dist"></div>
          </div>
        )
      }

      const domContainer = document.querySelector('#app')
      ReactDOM.render(<ApexChart />, domContainer)
    </script>

    
  </body>
</html>
