<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Dual Axis with Currency Labels</title>

    <link href="../../assets/styles.css" rel="stylesheet" />

    <style>
      #chart {
        max-width: 650px;
        margin: 35px auto;
      }
    </style>

    
    <script src="https://cdn.jsdelivr.net/npm/react@17.0.2/umd/react.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@17.0.2/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prop-types@15.8.1/prop-types.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/babel-core@5.8.34/browser.min.js"></script>
    <script src="../../../dist/apexcharts.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-apexcharts@1.7.0/dist/react-apexcharts.iife.min.js"></script>
    

    <script>
      // Replace Math.random() with a pseudo-random number generator to get reproducible results in e2e tests
      // Based on https://gist.github.com/blixt/f17b47c62508be59987b
      var _seed = 42
      Math.random = function () {
        _seed = (_seed * 16807) % 2147483647
        return (_seed - 1) / 2147483646
      }
    </script>

    
  </head>

  <body>
    
    <div id="app"></div>

    <div id="html">&lt;div id=&quot;chart&quot;&gt;
  &lt;ReactApexChart options={state.options} series={state.series} type=&quot;line&quot; height={420} /&gt;
&lt;/div&gt;</div>

    <script type="text/babel">
      const ApexChart = () => {
        const [state, setState] = React.useState({
          series: [
            {
              name: 'Booked',
              type: 'column',
              data: [51020, 13850, 11630, 23820, 59530],
            },
            {
              name: 'Invoiced',
              type: 'line',
              data: [51020, 13850, 11630, 23820, 59530],
            },
          ],
          options: {
            chart: {
              type: 'line',
              height: 420,
            },
            title: {
              text: 'Booked vs invoiced',
              align: 'left',
            },
            subtitle: {
              text: 'Two independently scaled axes can land both labels on the same row; dataLabels.avoidOverlap keeps them legible',
              align: 'left',
            },
            colors: ['#8bc34a', '#ef5350'],
            stroke: {
              width: [0, 2],
            },
            fill: {
              opacity: [0.35, 1],
            },
            markers: {
              size: [0, 4],
            },
            dataLabels: {
              enabled: true,
              background: {
                enabled: true,
                borderWidth: 0,
              },
              formatter: function (val) {
                return (
                  '$' +
                  (val / 1000).toLocaleString('en-US', {
                    minimumFractionDigits: 2,
                    maximumFractionDigits: 2,
                  }) +
                  'K'
                )
              },
            },
            xaxis: {
              categories: [
                'May 2026',
                'Jun 2026',
                'Jul 2026',
                'Aug 2026',
                'Sep 2026',
              ],
            },
            yaxis: [
              {
                seriesName: 'Booked',
                title: {
                  text: 'Booked',
                },
                labels: {
                  formatter: function (val) {
                    return '$' + (val / 1000).toFixed(0) + 'K'
                  },
                },
              },
              {
                seriesName: 'Invoiced',
                opposite: true,
                title: {
                  text: 'Invoiced',
                },
                labels: {
                  formatter: function (val) {
                    return '$' + (val / 1000).toFixed(0) + 'K'
                  },
                },
              },
            ],
          },
        })

        return (
          <div>
            <div id="chart">
              <ReactApexChart
                options={state.options}
                series={state.series}
                type="line"
                height={420}
              />
            </div>
            <div id="html-dist"></div>
          </div>
        )
      }

      const domContainer = document.querySelector('#app')
      ReactDOM.render(<ApexChart />, domContainer)
    </script>

    
  </body>
</html>
