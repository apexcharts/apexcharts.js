<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Icicle</title>

    <link href="../../assets/styles.css" rel="stylesheet" />

    <style>
      #chart {
        max-width: 760px;
        margin: 35px auto;
      }
    </style>

    
    <script src="https://cdn.jsdelivr.net/npm/react@17.0.2/umd/react.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@17.0.2/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prop-types@15.8.1/prop-types.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/babel-core@5.8.34/browser.min.js"></script>
    <script src="../../../dist/apexcharts.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-apexcharts@1.7.0/dist/react-apexcharts.iife.min.js"></script>
    

    <script>
      // Replace Math.random() with a pseudo-random number generator to get reproducible results in e2e tests
      // Based on https://gist.github.com/blixt/f17b47c62508be59987b
      var _seed = 42
      Math.random = function () {
        _seed = (_seed * 16807) % 2147483647
        return (_seed - 1) / 2147483646
      }
    </script>

    <script src="../../../dist/icicle.js"></script>
  </head>

  <body>
    
    <div id="app"></div>

    <div id="html">&lt;div id=&quot;chart&quot;&gt;
  &lt;ReactApexChart options={state.options} series={state.series} type=&quot;icicle&quot; height={420} /&gt;
&lt;/div&gt;</div>

    <script type="text/babel">
      const ApexChart = () => {
        const [state, setState] = React.useState({
          series: [
            {
              data: [
                {
                  x: 'All storage',
                  children: [
                    {
                      x: 'Engineering',
                      children: [
                        {
                          x: 'Platform',
                          children: [
                            { x: 'Build', y: 210 },
                            { x: 'Runtime', y: 160 },
                            { x: 'Tooling', y: 70 },
                          ],
                        },
                        {
                          x: 'Product',
                          children: [
                            { x: 'Web', y: 180 },
                            { x: 'Mobile', y: 120 },
                          ],
                        },
                        { x: 'Data', y: 140 },
                      ],
                    },
                    {
                      x: 'Design',
                      children: [
                        { x: 'Research', y: 60 },
                        { x: 'Brand', y: 45 },
                        { x: 'Systems', y: 35 },
                      ],
                    },
                    {
                      x: 'Operations',
                      children: [
                        { x: 'Support', y: 90 },
                        { x: 'Finance', y: 40 },
                      ],
                    },
                  ],
                },
              ],
            },
          ],
          options: {
            chart: {
              type: 'icicle',
              height: 420,
            },
            colors: ['#0EA5E9', '#14B8A6', '#F59E0B'],
            title: {
              text: 'Storage used, by department and team',
              align: 'left',
            },
            subtitle: {
              text: 'Click a band to zoom into that branch',
              align: 'left',
            },
            plotOptions: {
              icicle: {
                borderRadius: 3,
                spacing: 2,
                dataLabels: {
                  showValue: true,
                },
              },
            },
            stroke: {
              width: 1,
              colors: ['#fff'],
            },
          },
        })

        return (
          <div>
            <div id="chart">
              <ReactApexChart
                options={state.options}
                series={state.series}
                type="icicle"
                height={420}
              />
            </div>
            <div id="html-dist"></div>
          </div>
        )
      }

      const domContainer = document.querySelector('#app')
      ReactDOM.render(<ApexChart />, domContainer)
    </script>

    
  </body>
</html>
