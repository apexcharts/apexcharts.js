<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Raincloud Without the Box</title>

    <link href="../../assets/styles.css" rel="stylesheet" />

    <style>
      #chart {
        max-width: 820px;
        margin: 35px auto;
      }
    </style>

    
    <script src="../../../dist/apexcharts.js"></script>
    

    <script>
      // Replace Math.random() with a pseudo-random number generator to get reproducible results in e2e tests
      // Based on https://gist.github.com/blixt/f17b47c62508be59987b
      var _seed = 42
      Math.random = function () {
        _seed = (_seed * 16807) % 2147483647
        return (_seed - 1) / 2147483646
      }
    </script>

    <script src="../../../dist/features/raincloud.js"></script>
  <script>
    // Raw observations per group (Box-Muller Gaussian; Math.random is seeded by
    // the sample template).
    function sample(mean, sd, n) {
      var points = []
      for (var k = 0; k < n; k++) {
        var u1 = Math.random(),
          u2 = Math.random()
        var g = Math.sqrt(-2 * Math.log(u1)) * Math.cos(2 * Math.PI * u2)
        points.push(Math.round((mean + g * sd) * 10) / 10)
      }
      return points
    }
  </script>
  </head>

  <body>
     <div id="chart"></div>

    <script>
      var options = {
        series: [
          {
            name: 'Response time',
            data: [
              { x: 'Control', points: sample(340, 55, 180) },
              { x: 'Variant A', points: sample(305, 40, 180) },
              { x: 'Variant B', points: sample(285, 62, 180) },
            ],
          },
        ],
        chart: {
          type: 'raincloud',
          height: 440,
        },
        title: {
          text: 'Response times by cohort',
        },
        subtitle: {
          text: 'Half-density cloud + raw observations; box lane turned off',
        },
        plotOptions: {
          bar: {
            distributed: true,
          },
          violin: {
            // Hide the five-number box: its lane reflows to the cloud, so the rain
            // sits directly against the density baseline (no dead strip).
            box: {
              show: false,
            },
          },
        },
        legend: {
          show: false,
        },
        yaxis: {
          title: {
            text: 'Response time (ms)',
          },
        },
      }

      var chart = new ApexCharts(document.querySelector('#chart'), options)
      chart.render()
    </script>

    
  </body>
</html>
