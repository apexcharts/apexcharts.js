<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Border Radius Ungrouped Bar Series Mixed</title>

    <link href="../../assets/styles.css" rel="stylesheet" />

    <style>
      #chart {
        max-width: 650px;
        margin: 35px auto;
      }
    </style>

    
    <script src="../../../dist/apexcharts.js"></script>
    

    <script>
      // Replace Math.random() with a pseudo-random number generator to get reproducible results in e2e tests
      // Based on https://gist.github.com/blixt/f17b47c62508be59987b
      var _seed = 42
      Math.random = function () {
        _seed = (_seed * 16807) % 2147483647
        return (_seed - 1) / 2147483646
      }
    </script>

    
  </head>

  <body>
     <div id="chart"></div>

    <script>
      var options = {
        series: [
          { name: 'Budget below', data: [-13, -23, -20, -8] },
          { name: 'Budget above', data: [44, 55, 41, 37] },
          { name: 'Actual below', data: [-21, -7, -25, -13] },
          { name: 'Actual above', data: [11, 17, 15, 15] },
        ],
        chart: {
          type: 'bar',
          height: 380,
          stacked: true,
        },
        plotOptions: {
          bar: {
            horizontal: true,
            borderRadius: 10,
            borderRadiusApplication: 'end',
          },
        },
        colors: ['#008FFB', '#4FC3F7', '#00E396', '#66DA26'],
        dataLabels: {
          enabled: false,
        },
        stroke: {
          width: 1,
          colors: ['#fff'],
        },
        title: {
          text: 'ungrouped bar, mixed: single stack, outermost segments cap',
          style: { fontSize: '13px', fontWeight: 500 },
        },
        xaxis: {
          categories: ['Q1', 'Q2', 'Q3', 'Q4'],
        },
        legend: {
          position: 'top',
        },
      }

      var chart = new ApexCharts(document.querySelector('#chart'), options)
      chart.render()
    </script>

    
  </body>
</html>
