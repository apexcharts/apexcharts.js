<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Streamgraph (Share of Total)</title>

    <link href="../../assets/styles.css" rel="stylesheet" />

    <style>
      #chart {
        max-width: 650px;
        margin: 35px auto;
      }
    </style>

    
    <script src="https://cdn.jsdelivr.net/npm/vue/dist/vue.min.js"></script>
    <script src="../../../dist/apexcharts.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vue-apexcharts"></script>
    

    <script>
      // Replace Math.random() with a pseudo-random number generator to get reproducible results in e2e tests
      // Based on https://gist.github.com/blixt/f17b47c62508be59987b
      var _seed = 42
      Math.random = function () {
        _seed = (_seed * 16807) % 2147483647
        return (_seed - 1) / 2147483646
      }
    </script>

    
  </head>

  <body>
    
    <div id="app"><div id="chart">
      <apexchart type="streamgraph" height="380" :options="chartOptions" :series="series"></apexchart>
    </div></div>

    <!-- Below element is just for displaying source code. it is not required. DO NOT USE -->
    <div id="html">&lt;div id=&quot;chart&quot;&gt;
        &lt;apexchart type=&quot;streamgraph&quot; height=&quot;380&quot; :options=&quot;chartOptions&quot; :series=&quot;series&quot;&gt;&lt;/apexchart&gt;
      &lt;/div&gt;</div>

    <script>
      new Vue({
        el: '#app',
        components: {
          apexchart: VueApexCharts,
        },
        data: {
          series: [
            {
              name: 'Chrome',
              data: [64, 65, 63, 62, 60, 58, 56],
            },
            {
              name: 'Safari',
              data: [16, 17, 19, 20, 22, 24, 25],
            },
            {
              name: 'Edge',
              data: [3, 5, 7, 9, 11, 12, 14],
            },
            {
              name: 'Firefox',
              data: [10, 9, 8, 6, 5, 4, 3],
            },
            {
              name: 'Other',
              data: [7, 4, 3, 3, 2, 2, 2],
            },
          ],
          chartOptions: {
            chart: {
              type: 'streamgraph',
              height: 380,
            },
            colors: ['#0EA5E9', '#22C55E', '#F97316', '#EF4444', '#14B8A6'],
            plotOptions: {
              streamgraph: {
                // Each column normalized to its own total, so the chart reads as
                // composition over time rather than volume.
                offset: 'expand',
                order: 'inverse',
              },
            },
            title: {
              text: 'Share of page views by browser',
              align: 'left',
            },
            subtitle: {
              text: 'Illustrative data. Every column is 100% tall, so only the mix moves.',
              align: 'left',
            },
            xaxis: {
              categories: ['2019', '2020', '2021', '2022', '2023', '2024', '2025'],
            },
          },
        },
      })
    </script>
    
  </body>
</html>
