<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Horizontal Raincloud Chart</title>

    <link href="../../assets/styles.css" rel="stylesheet" />

    <style>
      #chart {
        max-width: 820px;
        margin: 35px auto;
      }
    </style>

    
    <script src="https://cdn.jsdelivr.net/npm/vue/dist/vue.min.js"></script>
    <script src="../../../dist/apexcharts.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vue-apexcharts"></script>
    

    <script>
      // Replace Math.random() with a pseudo-random number generator to get reproducible results in e2e tests
      // Based on https://gist.github.com/blixt/f17b47c62508be59987b
      var _seed = 42
      Math.random = function () {
        _seed = (_seed * 16807) % 2147483647
        return (_seed - 1) / 2147483646
      }
    </script>

    <script src="../../../dist/features/raincloud.js"></script>
  <script>
    // Raw observations per group (Box-Muller Gaussian; Math.random is seeded by
    // the sample template). One group is deliberately bimodal: the cloud shows
    // the two modes that the box alone would hide, which is the whole point of
    // stacking all three layers.
    function sample(mean, sd, n) {
      var points = []
      for (var k = 0; k < n; k++) {
        var u1 = Math.random(),
          u2 = Math.random()
        var g = Math.sqrt(-2 * Math.log(u1)) * Math.cos(2 * Math.PI * u2)
        points.push(Math.round((mean + g * sd) * 100) / 100)
      }
      return points
    }
  </script>
  </head>

  <body>
    
    <div id="app"><div id="chart">
      <apexchart type="raincloud" height="420" :options="chartOptions" :series="series"></apexchart>
    </div></div>

    <!-- Below element is just for displaying source code. it is not required. DO NOT USE -->
    <div id="html">&lt;div id=&quot;chart&quot;&gt;
        &lt;apexchart type=&quot;raincloud&quot; height=&quot;420&quot; :options=&quot;chartOptions&quot; :series=&quot;series&quot;&gt;&lt;/apexchart&gt;
      &lt;/div&gt;</div>

    <script>
      new Vue({
        el: '#app',
        components: {
          apexchart: VueApexCharts,
        },
        data: {
          series: [
            {
              name: 'Bill ratio',
              data: [
                { x: 'Adelie', points: sample(2.12, 0.16, 150) },
                { x: 'Chinstrap', points: sample(2.65, 0.14, 70) },
                {
                  x: 'Gentoo',
                  points: sample(3.08, 0.1, 60).concat(sample(3.28, 0.09, 60)),
                },
              ],
            },
          ],
          chartOptions: {
            chart: {
              type: 'raincloud',
              height: 420,
            },
            colors: ['#FE9C64', '#00A29B', '#2E93fA'],
            title: {
              text: 'Bill ratios of three penguin species',
            },
            subtitle: {
              text: 'Horizontal layout: cloud above the axis line, box and rain below',
            },
            plotOptions: {
              bar: {
                horizontal: true,
                distributed: true,
              },
            },
            legend: {
              show: false,
            },
            xaxis: {
              title: {
                text: 'Bill ratio (length / depth)',
              },
            },
          },
        },
      })
    </script>
    
  </body>
</html>
