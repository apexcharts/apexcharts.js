<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Horizontal Waterfall Chart</title>

    <link href="../../assets/styles.css" rel="stylesheet" />

    <style>
      #chart {
        max-width: 650px;
        margin: 35px auto;
      }
    </style>

    
    <script src="https://cdn.jsdelivr.net/npm/vue/dist/vue.min.js"></script>
    <script src="../../../dist/apexcharts.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vue-apexcharts"></script>
    

    <script>
      // Replace Math.random() with a pseudo-random number generator to get reproducible results in e2e tests
      // Based on https://gist.github.com/blixt/f17b47c62508be59987b
      var _seed = 42
      Math.random = function () {
        _seed = (_seed * 16807) % 2147483647
        return (_seed - 1) / 2147483646
      }
    </script>

    
  </head>

  <body>
    
    <div id="app"><div id="chart">
      <apexchart type="waterfall" height="400" :options="chartOptions" :series="series"></apexchart>
    </div></div>

    <!-- Below element is just for displaying source code. it is not required. DO NOT USE -->
    <div id="html">&lt;div id=&quot;chart&quot;&gt;
        &lt;apexchart type=&quot;waterfall&quot; height=&quot;400&quot; :options=&quot;chartOptions&quot; :series=&quot;series&quot;&gt;&lt;/apexchart&gt;
      &lt;/div&gt;</div>

    <script>
      new Vue({
        el: '#app',
        components: {
          apexchart: VueApexCharts,
        },
        data: {
          series: [
            {
              name: 'Headcount',
              data: [
                {
                  x: 'Opening',
                  y: 412,
                },
                {
                  x: 'Graduate intake',
                  y: 68,
                },
                {
                  x: 'Lateral hires',
                  y: 41,
                },
                {
                  x: 'Voluntary exits',
                  y: -57,
                },
                {
                  x: 'Restructuring',
                  y: -34,
                },
                {
                  x: 'Closing',
                  isTotal: true,
                },
              ],
            },
          ],
          chartOptions: {
            chart: {
              type: 'waterfall',
              height: 400,
            },
            plotOptions: {
              bar: {
                horizontal: true,
              },
            },
            title: {
              text: 'What moved headcount this year',
              align: 'left',
            },
            xaxis: {
              labels: {
                formatter: function (val) {
                  return Math.round(val)
                },
              },
            },
            dataLabels: {
              formatter: function (val) {
                return (val > 0 ? '+' : '') + val
              },
            },
          },
        },
      })
    </script>
    
  </body>
</html>
