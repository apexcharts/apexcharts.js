<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Waterfall with Crowded Currency Labels</title>

    <link href="../../assets/styles.css" rel="stylesheet" />

    <style>
      #chart {
        max-width: 760px;
        margin: 35px auto;
      }
    </style>

    
    <script src="https://cdn.jsdelivr.net/npm/vue/dist/vue.min.js"></script>
    <script src="../../../dist/apexcharts.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vue-apexcharts"></script>
    

    <script>
      // Replace Math.random() with a pseudo-random number generator to get reproducible results in e2e tests
      // Based on https://gist.github.com/blixt/f17b47c62508be59987b
      var _seed = 42
      Math.random = function () {
        _seed = (_seed * 16807) % 2147483647
        return (_seed - 1) / 2147483646
      }
    </script>

    <script src="../../../dist/features/waterfall.js"></script>
  </head>

  <body>
    
    <div id="app"><div id="chart">
      <apexchart type="waterfall" height="440" :options="chartOptions" :series="series"></apexchart>
    </div></div>

    <!-- Below element is just for displaying source code. it is not required. DO NOT USE -->
    <div id="html">&lt;div id=&quot;chart&quot;&gt;
        &lt;apexchart type=&quot;waterfall&quot; height=&quot;440&quot; :options=&quot;chartOptions&quot; :series=&quot;series&quot;&gt;&lt;/apexchart&gt;
      &lt;/div&gt;</div>

    <script>
      new Vue({
        el: '#app',
        components: {
          apexchart: VueApexCharts,
        },
        data: {
          series: [
            {
              name: 'Revenue',
              data: [
                {
                  x: '2023-Q3',
                  y: 168500000,
                },
                {
                  x: '2023-Q4',
                  y: 489400000,
                },
                {
                  x: '2024-Q1',
                  y: 1900000000,
                },
                {
                  x: '2024-Q2',
                  y: -811500000,
                },
                {
                  x: '2024-Q3',
                  y: 389500000,
                },
                {
                  x: '2024-Q4',
                  y: -703000000,
                },
                {
                  x: '2025-Q1',
                  y: 358000000,
                },
                {
                  x: '2025-Q2',
                  y: 138300000,
                },
                {
                  x: '2025-Q3',
                  y: -312700000,
                },
                {
                  x: '2025-Q4',
                  y: -346800000,
                },
                {
                  x: '2026-Q1',
                  y: 390300000,
                },
                {
                  x: '2026-Q2',
                  y: 109700000,
                },
                {
                  x: '2026-Q3',
                  y: -8400000,
                },
                {
                  x: '2026-Q4',
                  y: 14600000,
                },
                {
                  x: 'Latest',
                  isTotal: true,
                },
              ],
            },
          ],
          chartOptions: {
            chart: {
              type: 'waterfall',
              height: 440,
            },
            title: {
              text: 'What moved revenue, quarter by quarter',
              align: 'left',
            },
            subtitle: {
              text: 'Currency labels are wider than the quarters they sit on. dataLabels.avoidOverlap spaces them apart.',
              align: 'left',
            },
            colors: ['#26a69a', '#ef5350', '#42a5f5'],
            dataLabels: {
              style: {
                fontSize: '11px',
              },
              formatter: function (val) {
                var abs = Math.abs(val)
                var sign = val < 0 ? '-' : '+'
                if (abs >= 1000000000)
                  return sign + '$' + (abs / 1000000000).toFixed(2) + 'B'
                return sign + '$' + (abs / 1000000).toFixed(1) + 'M'
              },
            },
            xaxis: {
              labels: {
                rotate: -45,
                rotateAlways: true,
              },
            },
            yaxis: {
              labels: {
                formatter: function (val) {
                  return '$' + (val / 1000000000).toFixed(1) + 'B'
                },
              },
            },
            tooltip: {
              y: {
                formatter: function (val) {
                  return (val > 0 ? '+' : '') + '$' + val.toLocaleString('en-US')
                },
              },
            },
          },
        },
      })
    </script>
    
  </body>
</html>
