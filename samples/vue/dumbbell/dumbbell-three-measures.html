<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Dumbbell Chart - Three Measures</title>

    <link href="../../assets/styles.css" rel="stylesheet" />

    <style>
      #chart {
        max-width: 650px;
        margin: 35px auto;
      }
    </style>

    
    <script src="https://cdn.jsdelivr.net/npm/vue/dist/vue.min.js"></script>
    <script src="../../../dist/apexcharts.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vue-apexcharts"></script>
    

    <script>
      // Replace Math.random() with a pseudo-random number generator to get reproducible results in e2e tests
      // Based on https://gist.github.com/blixt/f17b47c62508be59987b
      var _seed = 42
      Math.random = function () {
        _seed = (_seed * 16807) % 2147483647
        return (_seed - 1) / 2147483646
      }
    </script>

    
  </head>

  <body>
    
    <div id="app"><div id="chart">
      <apexchart type="dumbbell" height="380" :options="chartOptions" :series="series"></apexchart>
    </div></div>

    <!-- Below element is just for displaying source code. it is not required. DO NOT USE -->
    <div id="html">&lt;div id=&quot;chart&quot;&gt;
        &lt;apexchart type=&quot;dumbbell&quot; height=&quot;380&quot; :options=&quot;chartOptions&quot; :series=&quot;series&quot;&gt;&lt;/apexchart&gt;
      &lt;/div&gt;</div>

    <script>
      new Vue({
        el: '#app',
        components: {
          apexchart: VueApexCharts,
        },
        data: {
          series: [
            {
              name: '2021',
              data: [
                {
                  x: 'Unit tests',
                  y: 62,
                },
                {
                  x: 'Linting',
                  y: 55,
                },
                {
                  x: 'Type checks',
                  y: 31,
                },
                {
                  x: 'E2E tests',
                  y: 24,
                },
                {
                  x: 'Security scan',
                  y: 18,
                },
              ],
            },
            {
              name: '2023',
              data: [
                {
                  x: 'Unit tests',
                  y: 74,
                },
                {
                  x: 'Linting',
                  y: 71,
                },
                {
                  x: 'Type checks',
                  y: 52,
                },
                {
                  x: 'E2E tests',
                  y: 39,
                },
                {
                  x: 'Security scan',
                  y: 37,
                },
              ],
            },
            {
              name: '2025',
              data: [
                {
                  x: 'Unit tests',
                  y: 88,
                },
                {
                  x: 'Linting',
                  y: 86,
                },
                {
                  x: 'Type checks',
                  y: 78,
                },
                {
                  x: 'E2E tests',
                  y: 58,
                },
                {
                  x: 'Security scan',
                  y: 64,
                },
              ],
            },
          ],
          chartOptions: {
            chart: {
              type: 'dumbbell',
              height: 380,
            },
            colors: ['#93C5FD', '#3B82F6', '#1D4ED8'],
            title: {
              text: 'Share of teams running each stage in CI',
              align: 'left',
            },
            subtitle: {
              text: 'Three snapshots on one row. Only the two extremes are labelled.',
              align: 'left',
            },
            plotOptions: {
              bar: {
                dumbbell: {
                  connector: {
                    color: '#E5E7EB',
                    opacity: 1,
                  },
                  dataLabels: {
                    formatter: function (val) {
                      return val + '%'
                    },
                  },
                },
              },
            },
            xaxis: {
              min: 0,
              max: 100,
              labels: {
                formatter: function (val) {
                  return val + '%'
                },
              },
            },
          },
        },
      })
    </script>
    
  </body>
</html>
