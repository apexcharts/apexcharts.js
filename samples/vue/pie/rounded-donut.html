<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Rounded Donut</title>

    <link href="../../assets/styles.css" rel="stylesheet" />

    <style>
      #chart {
        max-width: 420px;
        margin: 35px auto;
      }
    </style>

    
    <script src="https://cdn.jsdelivr.net/npm/vue/dist/vue.min.js"></script>
    <script src="../../../dist/apexcharts.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vue-apexcharts"></script>
    

    <script>
      // Replace Math.random() with a pseudo-random number generator to get reproducible results in e2e tests
      // Based on https://gist.github.com/blixt/f17b47c62508be59987b
      var _seed = 42
      Math.random = function () {
        _seed = (_seed * 16807) % 2147483647
        return (_seed - 1) / 2147483646
      }
    </script>

    
  </head>

  <body>
    
    <div id="app"><div id="chart">
      <apexchart type="donut" width="420" :options="chartOptions" :series="series"></apexchart>
    </div></div>

    <!-- Below element is just for displaying source code. it is not required. DO NOT USE -->
    <div id="html">&lt;div id=&quot;chart&quot;&gt;
        &lt;apexchart type=&quot;donut&quot; width=&quot;420&quot; :options=&quot;chartOptions&quot; :series=&quot;series&quot;&gt;&lt;/apexchart&gt;
      &lt;/div&gt;</div>

    <script>
      new Vue({
        el: '#app',
        components: {
          apexchart: VueApexCharts,
        },
        data: {
          series: [44, 25, 18, 13],
          chartOptions: {
            chart: {
              type: 'donut',
              width: 420,
            },
            labels: [
              'Marguerite Tillman',
              'Gabriel Barton',
              'Kathleen Abernathy',
              'Devon Reyes',
            ],
            colors: ['#0EA5E9', '#14B8A6', '#F59E0B', '#F43F5E'],
            plotOptions: {
              pie: {
                // Round the corners of every slice (px)
                borderRadius: 12,
                // Leave a gap between adjacent slices (px)
                spacing: 5,
                donut: {
                  size: '68%',
                  labels: {
                    show: true,
                    total: {
                      show: true,
                      label: 'Total Orders',
                    },
                  },
                },
              },
            },
            stroke: {
              width: 0,
            },
            dataLabels: {
              enabled: false,
            },
            legend: {
              position: 'bottom',
            },
            title: {
              text: 'Orders by sales team',
              align: 'left',
            },
            responsive: [
              {
                breakpoint: 480,
                options: {
                  chart: {
                    width: 320,
                  },
                },
              },
            ],
          },
        },
      })
    </script>
    
  </body>
</html>
